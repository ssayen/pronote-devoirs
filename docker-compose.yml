services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # joignable uniquement par le reverse proxy (Caddy) sur l'hôte
    volumes:
      - ./data:/data          # base SQLite + fichiers + credentials.json (persistant, à sauvegarder)
    environment:
      # les valeurs viennent du fichier .env (non versionné) : voir .env.example
      INVITE_CODE: "${INVITE_CODE:-}"        # code exigé pour créer un compte ; vide = seul le premier compte peut s'inscrire
      CHILD_NAME: "${CHILD_NAME:-}"          # ancienne installation seulement : enfant suivi (sinon réglé par compte à l'inscription)
      SYNC_INTERVAL_MIN: "${SYNC_INTERVAL_MIN:-30}"   # 0 = pas de synchro automatique ; ne pas descendre sous 15
      PUSH_TO_PRONOTE: "${PUSH_TO_PRONOTE:-0}"        # 1 = renvoyer « terminé » vers Pronote (non testé en réel)
      NOTIFY_URL: "${NOTIFY_URL:-}"                   # notification si le jeton Pronote est refusé (ex. https://ntfy.sh/mon-topic-secret)
      NOTIFY_TOKEN: "${NOTIFY_TOKEN:-}"               # jeton d'accès ntfy (optionnel)
      NEW_HOURS: "${NEW_HOURS:-48}"                   # durée du badge « Nouveau »
      DONE_KEEP_DAYS: "${DONE_KEEP_DAYS:-3}"          # « Terminé » masqué au-delà de N jours après l'échéance
